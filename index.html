<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Squaredle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="shell">
        <header class="topbar">
            <div>
                <p class="eyebrow">Daily word square</p>
                <h1>squaredle<span>.</span></h1>
            </div>
            <button class="icon-button" id="resetButton" type="button" aria-label="Reset puzzle">↻</button>
        </header>

        <section class="intro" aria-labelledby="title">
            <div>
                <p class="kicker">Find the hidden four</p>
                <h2 id="title">Trace four words.<br><em>Every tile matters.</em></h2>
            </div>
            <div class="score" aria-live="polite"><strong id="foundCount">0</strong><span>/ 4 found</span></div>
        </section>

        <section class="game-layout">
            <div class="board-wrap">
                <div class="board" id="board" aria-label="Word grid" role="grid"></div>
                <p class="board-note"><span class="dot"></span> Drag across touching letters</p>
            </div>
            <aside class="hint-panel">
                <p class="reveals">Reveals remaining: <strong id="revealsRemaining">2</strong> </p>
                <button class="count-link" id="revealCountsButton" type="button">Reveal tile counts</button>
                <div id="hintGroups"></div>
                <div class="status" id="status" aria-live="polite">Start with any letter.</div>
            </aside>
        </section>

        <footer>
            <span>PUZZLE 001</span><span>•</span><span id="footerMessage">We believe in you ! </span>
        </footer>
    </main>
    <script src="app.js"></script>
</body>

</html>
